name: cobratoolboxCI (merge, test, and upload)
on:
  pull_request:
    branches:
      - develop
      - master
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
# Only one CI run per PR (or ref) at a time: a new push cancels the in-flight
# run for the same ref instead of queuing another full MATLAB suite behind it.
# The single self-hosted runner (Blacknight) serializes jobs, so without this a
# burst of pushes to one PR piles up redundant queued runs. Keyed on the PR
# number for pull_request events; falls back to github.ref otherwise, so a PR
# and an unrelated dispatch never share a group.
concurrency:
  group: cobratoolboxCI-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build:
    # This job needs the self-hosted runner ("Blacknight") registered only on
    # opencobra/cobratoolbox -- licensed MATLAB Docker image, baked-in Gurobi
    # license. On a fork, the same workflow file still triggers (e.g. a PR
    # entirely within the fork, from a feature branch into the fork's own
    # develop), but no self-hosted runner is available there: the job queues
    # indefinitely and GitHub eventually marks it failed, showing contributors
    # a spurious "CI failed" unrelated to their code. Skip (not fail) outside
    # the one repo that actually has the runner; a PR *from* a fork *into*
    # opencobra/cobratoolbox still runs here, since github.repository for a
    # pull_request event is always the base (target) repo, never the fork.
    if: github.repository == 'opencobra/cobratoolbox'
    runs-on: self-hosted
    steps:
      - name: Cleanup orphaned MATLAB containers
        run: docker ps -q --filter ancestor=matlab | xargs -r docker rm -f
        continue-on-error: true

      # The MATLAB test step below runs in Docker as root and writes regenerable outputs
      # (e.g. test/verifiedTests/analysis/testCalculateFluxShifts/resultsPostOptimization/)
      # into the mounted workspace, owned by root. On the NEXT run, actions/checkout's
      # git-clean runs as the runner user and cannot unlink those root-owned files (EACCES),
      # so "Check out merged PR code" exits 1 before any test runs. Because checkout precedes
      # the existing chown steps, one leftover deadlocks CI permanently. Reclaim ownership
      # BEFORE checkout so git-clean can proceed; also auto-heals an already-stuck runner.
      # No-op on a fresh runner (guarded on an existing workspace).
      - name: Reclaim self-hosted workspace ownership (pre-checkout)
        run: |
          if [ -n "${GITHUB_WORKSPACE}" ] && [ -d "${GITHUB_WORKSPACE}" ]; then
            sudo chown -R "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}" || true
          fi
        continue-on-error: true

      - name: Check out merged PR code
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fix workspace ownership and permissions for Docker
        run: |
          sudo chown -R "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}"
          chmod -R o+rwx "${GITHUB_WORKSPACE}"

      # Change-based test selection: analyse the PR's changed files and pick only
      # the tests that (transitively) depend on them, so we stop re-running the
      # whole MATLAB suite on every PR. Fails safe to the FULL suite on any doubt
      # (core path touched, un-indexable change, analysis error). Outputs:
      #   mode        = full | selective | none
      #   run_tests   = true | false   (false => skip the MATLAB + report steps)
      #   test_filter = runTestSuite() regexp (empty when full)
      - name: Analyze changed files and select relevant tests
        id: select
        env:
          BASE_REF: ${{ github.base_ref }}
          # A 'ci-full' label on the PR forces the complete suite (see policy).
          COBRA_FORCE_FULL: ${{ contains(github.event.pull_request.labels.*.name, 'ci-full') }}
        run: |
          set -uo pipefail
          if [ -z "${BASE_REF:-}" ]; then
            echo "No base ref (manual/dispatch run) -> full suite."
            { echo "mode=full"; echo "run_tests=true"; echo "test_filter="; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # PRs targeting master run the COMPLETE suite so the coverage-gate
          # baseline stays thorough; never select a subset for a release branch.
          if [ "${BASE_REF}" = "master" ]; then
            echo "Base ref is master -> full suite (release baseline)."
            { echo "mode=full"; echo "run_tests=true"; echo "test_filter="; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Make the base branch available, then diff base...merged-HEAD.
          git fetch --no-tags --quiet origin "${BASE_REF}" || true
          if git rev-parse --verify --quiet "origin/${BASE_REF}" >/dev/null; then
            base="origin/${BASE_REF}"
          else
            base="${BASE_REF}"
          fi
          changed="${RUNNER_TEMP:-/tmp}/changed_files.txt"
          git diff --name-only --diff-filter=ACMRT "${base}...HEAD" > "${changed}" \
            || git diff --name-only "${base}" HEAD > "${changed}" || true
          echo "----- changed files -----"; cat "${changed}" || true; echo "-------------------------"
          if ! python3 .github/scripts/select_tests.py --changed "${changed}" --root . >> "$GITHUB_OUTPUT"; then
            echo "Selection script failed -> full suite."
            { echo "mode=full"; echo "run_tests=true"; echo "test_filter="; } >> "$GITHUB_OUTPUT"
          fi

      # MATLAB runs inside Docker
      - name: Run MATLAB Tests in Docker (licensed MAC, xvfb headless)
        if: steps.select.outputs.run_tests == 'true'
        env:
          QT_QPA_PLATFORM: offscreen
          JAVA_AWT_HEADLESS: "1"
          BASE_REF: ${{ github.base_ref }}
          COBRA_TESTS: ${{ steps.select.outputs.test_filter }}
        run: |
          set -euo pipefail
          # Test execution mode: fast by default on the VM (quick PR feedback);
          # PRs targeting master run the full suite so the coverage-gate baseline
          # (feature 001) stays thorough. Manual/dispatch runs (empty base_ref) use fast.
          if [ "${BASE_REF:-}" = "master" ]; then
            COBRA_TEST_MODE=full
          else
            COBRA_TEST_MODE=fast
          fi
          echo "COBRA_TEST_MODE=${COBRA_TEST_MODE} (PR base_ref='${BASE_REF:-<none>}')"
          # Change-based selection (see the 'select' step). Empty => full suite.
          echo "COBRA_TESTS filter: ${COBRA_TESTS:-<full suite>}"
          # Confirm the coverage-enabled MATLAB image exists: it is the base MATLAB
          # image plus a PATCHED MOcov + jsonlab baked at /opt, with MOCOV_PATH and
          # JSONLAB_PATH baked into the image ENV so test/testAll.m computes coverage.
          docker image inspect matlab-cov >/dev/null
          # NOTE: do NOT re-introduce -e MOCOV_PATH / -e JSONLAB_PATH here — the image
          # bakes them (pointing at the patched tools); passing empty or host values
          # would clobber the baked ENV and silently disable coverage.
          docker run --rm \
            --mac-address="02:42:ac:11:00:02" \
            --platform linux/amd64 \
            -e HOME=/tmp \
            -e USER=matlab \
            -e LOGNAME=matlab \
            -e COBRA_CI=1 \
            -e COBRA_TEST_MODE="${COBRA_TEST_MODE}" \
            -e COBRA_TESTS="${COBRA_TESTS:-}" \
            -e QT_QPA_PLATFORM="${QT_QPA_PLATFORM}" \
            -e JAVA_AWT_HEADLESS="${JAVA_AWT_HEADLESS}" \
            -v "${GITHUB_WORKSPACE}:/work" \
            -v "/opt/gurobi-license/gurobi.lic:/opt/gurobi1200/gurobi.lic:ro" \
            -w /work \
            --entrypoint bash \
            matlab-cov \
            -lc '
              set -euo pipefail
              echo "Running inside container as:"
              id
              echo "HOME=$HOME"
              echo "USER=$USER"
              mkdir -p /tmp/.matlab /tmp/.MathWorks
              echo "Configuring git safe directory..."
              git config --global --add safe.directory /work
              git config --global --add safe.directory "*"
              echo "Starting MATLAB tests..."
              xvfb-run -a -s "-screen 0 1280x1024x24" \
                matlab -noFigureWindows -batch "try; \
                  run(\"initCobraToolbox.m\"); \
                  changeCobraSolver(\"gurobi\",\"all\",0); \
                  set(0,\"DefaultFigureVisible\",\"off\"); \
                  run(\"test/testAll.m\"); \
                catch ME; \
                  disp(getReport(ME,\"extended\")); \
                  exit(1); \
                end; \
                exit(0);"
            '

      # Run even if the Docker test step failed, so a failed run still hands the
      # workspace back to the runner user instead of leaking root-owned files that
      # would deadlock the next checkout.
      - name: Fix workspace permissions after Docker run
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}"
        continue-on-error: true

      # Always publish the self-contained coverage report as an artifact, regardless
      # of Codecov (FR-002). warn (not fail) if coverage was not produced.
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: |
            coverage.xml
            coverage.json
            coverage_html
          if-no-files-found: warn

      # Best-effort upload to Codecov: never fail the build if Codecov is
      # unreachable or the token is absent (FR-004, SC-006).
      - name: Upload coverage to Codecov (best-effort)
        if: always()
        continue-on-error: true
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

      # Skip-count gate: report the skipped-test count and WARN (never fail) when it
      # exceeds the committed baseline — surfaces silent test-suite erosion (FR-007,
      # FR-008). Hard-fail hardening is deferred by design.
      - name: Skip-count gate (flag/warn only)
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          report="testReport.junit.xml"
          baseline="test/verifiedTests/.skip-baseline.json"
          if [ ! -f "$report" ]; then
            echo "::warning:: ${report} not found; cannot evaluate the skip-count gate."
            exit 0
          fi
          # Extract the skipped= attribute value only (present solely on <testsuite>);
          # grep the attribute directly so we never pick up tests=/failures=/errors=.
          skipped=$(grep -oE 'skipped="[0-9]+"' "$report" | grep -oE '[0-9]+' | head -1)
          skipped=${skipped:-0}
          maxSkipped=$(grep -oE '"maxSkipped"[[:space:]]*:[[:space:]]*[0-9]+' "$baseline" 2>/dev/null | grep -oE '[0-9]+' | head -1)
          maxSkipped=${maxSkipped:-0}
          echo "Skipped tests: ${skipped} (baseline maxSkipped: ${maxSkipped})"
          if [ "${skipped}" -gt "${maxSkipped}" ]; then
            echo "::warning:: Skipped tests (${skipped}) exceed the baseline (${maxSkipped}) — possible silent test-suite erosion. If intentional, update ${baseline}."
          fi
          exit 0

      - name: Set up Node.js 20
        if: steps.select.outputs.run_tests == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Convert JUnit to CTRF
        if: steps.select.outputs.run_tests == 'true'
        run: |
          MAJOR="$(node -p "process.versions.node.split('.')[0]")"
          if [ "$MAJOR" -lt 20 ]; then
            echo "❌ Node.js version too old: $(node -v)"
            exit 1
          fi
          echo "✅ Node version: $(node -v)"
          echo "✅ npm version: $(npm -v)"
          mkdir -p ./ctrf
          echo "Converting JUnit XML to CTRF JSON..."
          npx --yes junit-to-ctrf@0.0.12 ./testReport.junit.xml -o ./ctrf/ctrf-report.json

      - name: Normalize CTRF Test Names
        if: steps.select.outputs.run_tests == 'true'
        run: |
          node -e '
            const fs = require("fs");
            const path = "./ctrf/ctrf-report.json";
            const report = JSON.parse(fs.readFileSync(path, "utf8"));
            for (const test of report.results?.tests || []) {
              if (typeof test.name === "string") {
                test.name = test.name.split(": ").pop();
              }
            }
            fs.writeFileSync(path, JSON.stringify(report, null, 2) + "\n");
          '

      - name: Upload CTRF Artifact
        if: steps.select.outputs.run_tests == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: testReport
          path: ./ctrf/ctrf-report.json

      - name: Save PR Number
        run: echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_ENV

      - name: Upload PR Number as Artifact
        run: echo $PR_NUMBER > pr_number.txt

      - name: Upload PR Number Artifact
        uses: actions/upload-artifact@v6
        with:
          name: pr_number
          path: pr_number.txt
