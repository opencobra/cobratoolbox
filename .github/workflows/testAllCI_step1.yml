name: cobratoolboxCI (merge, test, and upload)
on:
  pull_request:
    branches:
      - develop
      - master
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Cleanup orphaned MATLAB containers
        run: docker ps -q --filter ancestor=matlab | xargs -r docker rm -f
        continue-on-error: true

      - name: Check out merged PR code
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fix workspace ownership and permissions for Docker
        run: |
          sudo chown -R "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}"
          chmod -R o+rwx "${GITHUB_WORKSPACE}"

      # Provision the coverage tooling the harness already knows how to use
      # (MoCov + jsonlab). Cloned on the runner host so the MATLAB container stays
      # network-free. Best-effort: if a clone fails, MOCOV_PATH/JSONLAB_PATH are left
      # unset and test/testAll.m simply does not compute coverage (FR-004) — the
      # pass/fail run is unaffected. TODO: pin to a verified tag/commit.
      - name: Provision coverage tools (MoCov + jsonlab)
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/.ci-tools"
          if [ ! -d "${GITHUB_WORKSPACE}/.ci-tools/MOcov/.git" ]; then
            git clone --depth 1 https://github.com/MOcov/MOcov.git "${GITHUB_WORKSPACE}/.ci-tools/MOcov" || true
          fi
          if [ ! -d "${GITHUB_WORKSPACE}/.ci-tools/jsonlab/.git" ]; then
            git clone --depth 1 https://github.com/fangq/jsonlab.git "${GITHUB_WORKSPACE}/.ci-tools/jsonlab" || true
          fi
          # Enable coverage only if BOTH tools are present (paths are /work/... inside the container).
          if [ -d "${GITHUB_WORKSPACE}/.ci-tools/MOcov" ] && [ -d "${GITHUB_WORKSPACE}/.ci-tools/jsonlab" ]; then
            echo "MOCOV_PATH=/work/.ci-tools/MOcov" >> "$GITHUB_ENV"
            echo "JSONLAB_PATH=/work/.ci-tools/jsonlab" >> "$GITHUB_ENV"
            echo "Coverage tooling provisioned; coverage will be computed."
          else
            echo "::warning:: MoCov/jsonlab not available; coverage will be skipped (pass/fail unaffected)."
          fi

      # MATLAB runs inside Docker
      - name: Run MATLAB Tests in Docker (licensed MAC, xvfb headless)
        env:
          QT_QPA_PLATFORM: offscreen
          JAVA_AWT_HEADLESS: "1"
        run: |
          set -euo pipefail
          # Confirm MATLAB image exists
          docker image inspect matlab >/dev/null
          docker run --rm \
            --mac-address="02:42:ac:11:00:02" \
            --platform linux/amd64 \
            -e HOME=/tmp \
            -e USER=matlab \
            -e LOGNAME=matlab \
            -e COBRA_CI=1 \
            -e MOCOV_PATH="${MOCOV_PATH:-}" \
            -e JSONLAB_PATH="${JSONLAB_PATH:-}" \
            -e QT_QPA_PLATFORM="${QT_QPA_PLATFORM}" \
            -e JAVA_AWT_HEADLESS="${JAVA_AWT_HEADLESS}" \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            --entrypoint bash \
            matlab \
            -lc '
              set -euo pipefail
              echo "Running inside container as:"
              id
              echo "HOME=$HOME"
              echo "USER=$USER"
              mkdir -p /tmp/.matlab /tmp/.MathWorks
              echo "Configuring git safe directory..."
              git config --global --add safe.directory /work
              git config --global --add safe.directory "*"
              echo "Starting MATLAB tests..."
              xvfb-run -a -s "-screen 0 1280x1024x24" \
                matlab -noFigureWindows -batch "try; \
                  run(\"initCobraToolbox.m\"); \
                  changeCobraSolver(\"gurobi\",\"all\",0); \
                  set(0,\"DefaultFigureVisible\",\"off\"); \
                  run(\"test/testAll.m\"); \
                catch ME; \
                  disp(getReport(ME,\"extended\")); \
                  exit(1); \
                end; \
                exit(0);"
            '

      - name: Fix workspace permissions after Docker run
        run: sudo chown -R "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}"
        continue-on-error: true

      # Always publish the self-contained coverage report as an artifact, regardless
      # of Codecov (FR-002). warn (not fail) if coverage was not produced.
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: |
            coverage.xml
            coverage.json
            coverage_html
          if-no-files-found: warn

      # Best-effort upload to Codecov: never fail the build if Codecov is
      # unreachable or the token is absent (FR-004, SC-006).
      - name: Upload coverage to Codecov (best-effort)
        if: always()
        continue-on-error: true
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

      # Skip-count gate: report the skipped-test count and WARN (never fail) when it
      # exceeds the committed baseline — surfaces silent test-suite erosion (FR-007,
      # FR-008). Hard-fail hardening is deferred by design.
      - name: Skip-count gate (flag/warn only)
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          report="testReport.junit.xml"
          baseline="test/verifiedTests/.skip-baseline.json"
          if [ ! -f "$report" ]; then
            echo "::warning:: ${report} not found; cannot evaluate the skip-count gate."
            exit 0
          fi
          skipped=$(grep -oE '<testsuite[^>]*skipped="[0-9]+"' "$report" | grep -oE '[0-9]+' | head -1)
          skipped=${skipped:-0}
          maxSkipped=$(grep -oE '"maxSkipped"[[:space:]]*:[[:space:]]*[0-9]+' "$baseline" 2>/dev/null | grep -oE '[0-9]+' | head -1)
          maxSkipped=${maxSkipped:-0}
          echo "Skipped tests: ${skipped} (baseline maxSkipped: ${maxSkipped})"
          if [ "${skipped}" -gt "${maxSkipped}" ]; then
            echo "::warning:: Skipped tests (${skipped}) exceed the baseline (${maxSkipped}) — possible silent test-suite erosion. If intentional, update ${baseline}."
          fi
          exit 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Convert JUnit to CTRF
        run: |
          MAJOR="$(node -p "process.versions.node.split('.')[0]")"
          if [ "$MAJOR" -lt 20 ]; then
            echo "❌ Node.js version too old: $(node -v)"
            exit 1
          fi
          echo "✅ Node version: $(node -v)"
          echo "✅ npm version: $(npm -v)"
          mkdir -p ./ctrf
          echo "Converting JUnit XML to CTRF JSON..."
          npx --yes junit-to-ctrf@0.0.12 ./testReport.junit.xml -o ./ctrf/ctrf-report.json

      - name: Normalize CTRF Test Names
        run: |
          node -e '
            const fs = require("fs");
            const path = "./ctrf/ctrf-report.json";
            const report = JSON.parse(fs.readFileSync(path, "utf8"));
            for (const test of report.results?.tests || []) {
              if (typeof test.name === "string") {
                test.name = test.name.split(": ").pop();
              }
            }
            fs.writeFileSync(path, JSON.stringify(report, null, 2) + "\n");
          '

      - name: Upload CTRF Artifact
        uses: actions/upload-artifact@v6
        with:
          name: testReport
          path: ./ctrf/ctrf-report.json

      - name: Save PR Number
        run: echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_ENV

      - name: Upload PR Number as Artifact
        run: echo $PR_NUMBER > pr_number.txt

      - name: Upload PR Number Artifact
        uses: actions/upload-artifact@v6
        with:
          name: pr_number
          path: pr_number.txt
