  T013:
    agent: "matlab-developer"
    reason: "US1 verification: runs status/builder tests + the 009 oracle (MATLAB, serial)."
  # --- Phase 4: US2 (abstraction bypasses) ---
  T014:
    agent: "default"
    reason: "Shell grep to count direct-solver references (no MATLAB)."
  T015:
    agent: "Technical Writer"
    reason: "Authors the documented solver-islands list artifact (markdown) from research.md R2.2."
  T016:
    agent: "matlab-developer"
    reason: "New testSolverAbstractionRouting.m (MATLAB portability + island graceful test)."
  T017:
    agent: "matlab-developer"
