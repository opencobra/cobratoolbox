# Agent Assignments
# Feature: 015-solver-spine-hardening
# Generated: 2026-07-20
# Command: /speckit-agent-assign-assign
#
# NOTE (shared-MATLAB-session constraint): all matlab-developer agents share ONE
# local MATLAB session. Parallel file EDITS across distinct .m files are safe, but
# MATLAB EXECUTION (running tests, check_matlab_code) serializes on that one session
# and can wedge if two agents drive MATLAB at once. The execute stage must run the
# verification/test tasks serially and respect the dependency notes below.

agents_scanned:
  - name: "matlab-developer"
    source: "user"
    description: "MATLAB coding specialist; edits and verifies .m code against the local MATLAB via the MATLAB MCP server."
  - name: "Technical Writer"
    source: "user"
    description: "Developer documentation specialist (README, references, artifacts)."
  - name: "Code Reviewer"
    source: "user"
    description: "Correctness/maintainability/perf reviewer."
  - name: "Minimal Change Engineer"
    source: "user"
    description: "Minimum-viable-diff specialist; no scope creep."
  - name: "Software Architect"
    source: "user"
    description: "System design and architectural decisions."
  - name: "Git Workflow Master"
    source: "user"
    description: "Git workflows, branching, commits."
  - name: "DevOps Automator"
    source: "user"
    description: "CI/CD and infra automation."
  - name: "Codebase Onboarding Engineer"
    source: "user"
    description: "Fast codebase comprehension from source."
  - name: "Codebase Archaeologist"
    source: "user"
    description: "Multi-tool drift / dead-code / doc-divergence auditor."

# default = the main orchestration loop (non-specialized shell/markdown tasks).

assignments:
  # --- Phase 1: Setup ---
  T001:
    agent: "matlab-developer"
    reason: "Runs the feature-009 net + testSolvers baseline via the MATLAB MCP server."
  T002:
    agent: "matlab-developer"
    reason: "Records the installed-solver set from initCobraToolbox/changeCobraSolver output (MATLAB)."
  # --- Phase 2: Foundational ---
  T003:
    agent: "matlab-developer"
    reason: "Applies MATLAB coding-standards guardrail via check_matlab_code + the MATLAB review skill."
  # --- Phase 3: US1 (status consolidation + builder bug) ---
  T004:
    agent: "matlab-developer"
    reason: "Extends testMapSolverStatus.m (MATLAB unit test)."
  T005:
    agent: "matlab-developer"
    reason: "New testBuildOptProblemNamesCon.m regression test (MATLAB)."
  T006:
    agent: "matlab-developer"
    reason: "Bug A/Bug B regression guards in MATLAB tests."
  T007:
    agent: "matlab-developer"
    reason: "Extends mapSolverStatus.m — the shared status mapper. BLOCKS T008–T011."
  T008:
    agent: "matlab-developer"
    reason: "Routes solveCobraLP.m through mapSolverStatus + fixes Bug B. Depends on T007."
  T009:
    agent: "matlab-developer"
    reason: "Routes solveCobraQP.m + deletes inline dqqStatMap. Depends on T007."
  T010:
    agent: "matlab-developer"
    reason: "Routes solveCobraMILP.m through mapSolverStatus. Depends on T007."
  T011:
